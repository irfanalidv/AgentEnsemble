[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentensemble"
version = "0.6.1"
description = "Build, orchestrate, trace, and test multi-agent LLM systems in Python: ReAct, RAG, router, planner, workflow graphs, swarms, debates, and pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Irfan Ali", email = "irfanali29@hotmail.com"}
]
maintainers = [
    {name = "Irfan Ali", email = "irfanali29@hotmail.com"}
]
keywords = [
    "ai-agents",
    "multi-agent",
    "multi-agent-systems",
    "agent-orchestration",
    "orchestration",
    "llm",
    "langchain",
    "langgraph",
    "mistral",
    "openai",
    "rag",
    "react-agent",
    "tool-calling",
    "function-calling",
    "agent-testing",
    "agentic-ai",
    "state-graph",
    "workflow",
    "tracing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "langchain>=1.1.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "langchain-openai>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
observability = [
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.20.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "langchain-text-splitters>=0.0.1",
    "beautifulsoup4>=4.12.0",
]
search = [
    "ddgs>=9.0.0",  # DuckDuckGo backend used by langchain-community (free fallback search)
    "google-search-results>=2.4.2",
]
all = [
    "agentensemble[observability,rag,search]",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/AgentEnsemble"
Documentation = "https://github.com/irfanalidv/AgentEnsemble#readme"
Repository = "https://github.com/irfanalidv/AgentEnsemble"
Issues = "https://github.com/irfanalidv/AgentEnsemble/issues"
Changelog = "https://github.com/irfanalidv/AgentEnsemble/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["agentensemble*"]

[tool.setuptools.package-data]
agentensemble = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]
ignore = [
    "RUF022",  # __all__ lists are grouped by category on purpose, not sorted alphabetically
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]  # examples load .env / tweak sys.path before importing the package

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # langchain-community announces its sunset on import; not actionable for our tests.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]
